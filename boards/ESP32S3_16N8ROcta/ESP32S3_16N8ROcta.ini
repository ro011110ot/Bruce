; PlatformIO Project Configuration File
;
; ESP32S3_16N8ROcta - ESP32-S3 (QFN56) with 16MB Flash
;                    8MB PSRAM, ILI9341 2.8" SPI Display + XPT2046 Touch
;
; Hardware:
;   - ESP32-S3 QFN56 rev v0.2 (16MB Macronix Flash, 8MB AP Memory PSRAM)
;   - ILI9341 240x320 IPS TFT (4-wire SPI, on FSPI bus)
;   - XPT2046 Resistive Touch (SPI, shares FSPI with display)
;   - Backlight PWM (GPIO38)

[env:ESP32S3_16N8ROcta]
board = ESP32S3_16N8ROcta
board_build.partitions = boards/ESP32S3_16N8ROcta/partitions_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/ESP32S3_16N8ROcta>
build_flags =
	${env.build_flags}
	-Iboards/ESP32S3_16N8ROcta
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; TFT SPI port for ESP32-S3 — use FSPI (SPI2, native on this chip)
	-DUSE_FSPI_PORT=1

	; Touch screen
	-DHAS_TOUCH=1

	; Allow all GPIOs for IR/RF (user wires external modules)
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	; Redraw delay to improve menu navigation on this display
	-DREDRAW_DELAY=1

	; ESP32-S3 fatfs include paths (needed for FFat library)
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/**

lib_deps =
	${env.lib_deps}

lib_ignore =
	SD
